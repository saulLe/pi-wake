<svg width="100%" viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pi 二次开发的四条路径，按投入和掌控力递增排列</title>
<desc>从装包和 Skill、写 Extension、SDK 与 RPC 嵌入，到 Fork 源码深度改造，投入与掌控力依次递增。</desc>
<text x="40" y="30" dominant-baseline="central" style="font-size:12px;fill:#5F5E5A">投入与掌控力递增 →</text>
<rect x="40" y="50" width="141" height="90" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="110" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">装包 / Skill</text>
<text x="110" y="96" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">零代码 · 分钟级</text>
<text x="110" y="119" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">复用现成能力</text>
<rect x="193" y="50" width="141" height="90" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="263" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">写 Extension</text>
<text x="263" y="96" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">TypeScript · 低门槛</text>
<text x="263" y="119" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">定制工具与命令</text>
<rect x="346" y="50" width="141" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="416" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">SDK / RPC</text>
<text x="416" y="96" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">嵌入自有应用</text>
<text x="416" y="119" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">中等工程量</text>
<rect x="499" y="50" width="141" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="569" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">Fork 源码</text>
<text x="569" y="96" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">完全掌控 · 重维护</text>
<text x="569" y="119" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">深度改造内核</text>
</svg>
