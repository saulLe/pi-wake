<svg width="100%" viewBox="0 0 680 455" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pi 开源 AI 编码智能体架构分层</title>
<desc>四种使用模式接入 coding-agent CLI，向下依赖 agent-core 运行时与 pi-ai 统一模型层，底层可由可插拔扩展层注入定制。</desc>
