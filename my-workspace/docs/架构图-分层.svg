<text x="340" y="202" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">pi-agent-core</text>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5">工具调用循环 + 状态管理</text>
