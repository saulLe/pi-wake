<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="135" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="107" y="64" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">交互 TUI</text>
<rect x="195" y="40" width="135" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
